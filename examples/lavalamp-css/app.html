<!doctype html>
<html><head><style>
  /* A lava lamp in pure HTML + CSS — no canvas, no Pascal, no JS.
     Sized in vh so the whole lamp scales with the window HEIGHT and stays
     centred; the blur/contrast "goo" fuses/splits the blobs as they drift. */

  html,body{margin:0;height:100%}
  body{background:#0b0710;color:#e7d8ff;font-family:sans-serif;text-align:center}
  /* a real div (not body) as the full-viewport flex column: this engine centres
     flex children of a div, so align-items:center places the lamp dead-centre. */
  .stage{width:100vw;height:100vh;box-sizing:border-box;padding:2vh 16px;
         display:flex;flex-direction:column;align-items:center;justify-content:center}
  h1{width:100%;font-size:2.1vh;font-weight:600;letter-spacing:.08em;margin:0 0 1.2vh;
     text-transform:uppercase}
  p{width:100%;color:#6b5b86;font-size:1.5vh;margin:1.4vh 0 0;letter-spacing:.05em}

  /* one scale: everything below is the original px design × 0.155, in vh */
  .lamp{position:relative;width:34.1vh;height:80vh;
        display:flex;flex-direction:column;align-items:center}

  .cap{width:18.3vh;height:4vh;border-radius:1.24vh 1.24vh .62vh .62vh;
       background:linear-gradient(#6b6880,#33323f);z-index:3}
  .base{width:23.3vh;height:6.5vh;border-radius:.93vh .93vh 2.17vh 2.17vh;
        background:linear-gradient(#33323f,#6b6880);z-index:3;margin-top:-1.24vh}

  /* pill-shaped glass vessel with a lit liquid */
  .glass{position:relative;width:27.3vh;height:76.9vh;overflow:hidden;
         border-radius:13.64vh;
         background:radial-gradient(circle at 50% 72%, #5a3a8f 0%, #331e59 52%, #180f2c 100%);
         box-shadow:inset 0 0 28px rgba(0,0,0,.45), 0 16px 50px rgba(0,0,0,.6);
         border:1px solid #2a1c44}

  /* the goo: blur+contrast fuses/splits the blobs (blur in vh so it scales too) */
  .goo{position:absolute;inset:0;filter:blur(1.08vh) contrast(8)}
  .blob{position:absolute;border-radius:50%;background:#ff7d24}

  /* a slim glass sheen, above the goo (unfiltered) */
  .sheen{position:absolute;top:5.27vh;left:3.72vh;width:1.86vh;height:46.5vh;
         border-radius:1.24vh;z-index:2;
         background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,0))}

  .b1{width:11.47vh;height:11.47vh;left:6.82vh;top:43.4vh;
      animation:rise1 15s ease-in-out infinite}
  .b2{width:8.68vh;height:8.68vh;left:6.2vh;top:23.25vh;
      animation:rise2 19s ease-in-out infinite}
  .b3{width:9.61vh;height:9.61vh;left:11.47vh;top:10.85vh;
      animation:rise3 23s ease-in-out infinite}
  .b4{width:7.75vh;height:7.75vh;left:10.23vh;top:49.6vh;
      animation:rise1 17s ease-in-out infinite}
  .b5{width:6.82vh;height:6.82vh;left:7.13vh;top:32.55vh;
      animation:rise2 21s ease-in-out infinite}

  @keyframes rise1{0%,100%{transform:translateY(0)} 50%{transform:translateY(-23.25vh)}}
  @keyframes rise2{0%,100%{transform:translateY(0)} 50%{transform:translateY(13.95vh)}}
  @keyframes rise3{0%,100%{transform:translateY(0)} 50%{transform:translateY(21.7vh)}}
</style></head><body>

 <div class="stage">
  <h1>Tina4 Lava Lamp &middot; CSS</h1>

  <div class="lamp">
    <div class="cap"></div>
    <div class="glass">
      <div class="goo">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
        <span class="blob b3"></span>
        <span class="blob b4"></span>
        <span class="blob b5"></span>
      </div>
      <div class="sheen"></div>
    </div>
    <div class="base"></div>
  </div>

  <p>pure HTML + CSS &middot; @keyframes + blur/contrast goo</p>
 </div>

</body></html>
