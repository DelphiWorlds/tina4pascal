<body style="margin:0;overflow:hidden;font-family:sans-serif">
  <style>
    @keyframes sway { 0% { transform: translateX(0) } 50% { transform: translateX(-24px) } 100% { transform: translateX(0) } }
    @keyframes sway2{ 0% { transform: translateX(0) } 50% { transform: translateX(-12px) } 100% { transform: translateX(0) } }
    @keyframes bob  { 0% { transform: translateY(0) } 50% { transform: translateY(-8px) } 100% { transform: translateY(0) } }
  </style>
  <div style="position:relative;width:480px;height:640px;overflow:hidden;background:linear-gradient(180deg,#2d2352 0%,#9c5663 55%,#f2b172 100%)">
    <div style="position:absolute;top:104px;left:306px;width:108px;height:108px;border-radius:50%;background:radial-gradient(circle at 44% 42%,#fff2d0,#f0a85c);z-index:0"></div>
    <img src="assets/range.png" style="position:absolute;left:-60px;bottom:262px;width:600px;height:235px;opacity:0.55;z-index:1;animation:sway2 46s ease-in-out infinite">
    <img src="assets/range.png" style="position:absolute;left:-40px;bottom:214px;width:560px;height:219px;z-index:2;animation:sway 32s ease-in-out infinite">
    <img src="assets/rock.png"  style="position:absolute;left:0;bottom:0;width:100%;height:646px;z-index:3">
    <img src="assets/duo.png"   style="position:absolute;left:96px;bottom:150px;width:300px;height:255px;z-index:4;animation:bob 7s ease-in-out infinite">
  </div>
</body>
