<body style="margin:0;overflow:hidden;font-family:sans-serif">
  <style>
    @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-480px) } }
    @keyframes bob   { 0% { transform: translateY(0) } 50% { transform: translateY(-9px) } 100% { transform: translateY(0) } }
    .l1 { animation: drift 52s linear infinite }
    .l2 { animation: drift 32s linear infinite }
    .l3 { animation: drift 20s linear infinite }
  </style>

  <!-- in-flow stage; children are absolute layers (z: sky<back<mid<front<ground<duo) -->
  <div style="position:relative;width:480px;height:640px;overflow:hidden;background:linear-gradient(180deg,#241640 0%,#5e3566 50%,#c25f82 100%)">

    <!-- sun -->
    <div style="position:absolute;top:66px;left:312px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 42% 40%,#fff3c9,#f3b86a);z-index:0"></div>

    <!-- three animated mountain ranges (2D canvas, drawn in Pascal) -->
    <canvas id="back"  width="960" height="300" class="l1" style="position:absolute;left:0;top:230px;width:960px;height:300px;z-index:1"></canvas>
    <canvas id="mid"   width="960" height="300" class="l2" style="position:absolute;left:0;top:270px;width:960px;height:300px;z-index:2"></canvas>
    <canvas id="front" width="960" height="300" class="l3" style="position:absolute;left:0;top:300px;width:960px;height:300px;z-index:3"></canvas>

    <!-- near ground band (hides the ranges' bases) -->
    <div style="position:absolute;left:0;bottom:0;width:480px;height:66px;background:#17101f;z-index:4"></div>

    <!-- foreground: the duo stands ON the ground, fully visible, with a gentle bob -->
    <img src="assets/duo.webp" style="position:absolute;left:84px;bottom:44px;width:316px;height:268px;z-index:5;animation:bob 7s ease-in-out infinite">
  </div>
</body>
