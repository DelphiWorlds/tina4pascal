<body style="margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column">

  <!-- ── app bar ───────────────────────────────────────────────────────── -->
  <header style="padding:18px 20px;background:#111827;border-bottom:1px solid #1f2937">
    <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#64748b">Tina4 · multi-screen</div>
    <div style="font-size:20px;font-weight:700;margin-top:2px">Screens</div>
  </header>

  <!-- ── the stage: one container, swapped at runtime ──────────────────────
       Each tap runs the BUILT-IN view.show action — no app code — which clones
       the matching <template> below into #stage. #stage starts on Home. -->
  <main id="stage" style="flex:1;padding:24px 20px">
    <section>
      <h2 style="margin:0 0 8px">🏠 Home</h2>
      <p style="color:#94a3b8;margin:0">Welcome. Pick a tab below — each one swaps this
      area for a different screen, live, without reloading the page.</p>
    </section>
  </main>

  <!-- ── bottom tab bar: pure HTML, built-in navigation ───────────────────- -->
  <nav style="display:flex;background:#111827;border-top:1px solid #1f2937">
    <button onclick="view.show('stage','scr-home')"
      style="flex:1;padding:14px 0;border:0;background:transparent;color:#e2e8f0;font-size:14px">🏠 Home</button>
    <button onclick="view.show('stage','scr-explore')"
      style="flex:1;padding:14px 0;border:0;background:transparent;color:#e2e8f0;font-size:14px">🧭 Explore</button>
    <button onclick="view.show('stage','scr-profile')"
      style="flex:1;padding:14px 0;border:0;background:transparent;color:#e2e8f0;font-size:14px">👤 Profile</button>
    <!-- This screen is welded into the binary from pages/stats.html (view.load) -->
    <button onclick="view.load('stage','stats.html')"
      style="flex:1;padding:14px 0;border:0;background:transparent;color:#e2e8f0;font-size:14px">📊 Stats</button>
  </nav>

  <!-- ── the screens, defined once as inert <template>s ────────────────────
       <template> is parsed but never rendered; view.show clones its content on
       demand. Everything lives in this ONE file — nothing to bundle, identical
       on desktop and mobile. -->
  <template id="scr-home">
    <section>
      <h2 style="margin:0 0 8px">🏠 Home</h2>
      <p style="color:#94a3b8;margin:0 0 16px">Welcome back. Pick a tab below to move between screens.</p>
      <div style="background:#1e293b;border-radius:12px;padding:16px">
        <div style="font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:1px">Today</div>
        <div style="font-size:28px;font-weight:700;margin-top:4px">3 new items</div>
      </div>
    </section>
  </template>

  <template id="scr-explore">
    <section>
      <h2 style="margin:0 0 8px">🧭 Explore</h2>
      <p style="color:#94a3b8;margin:0 0 16px">A different screen, swapped into the same container.</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="background:#1e293b;border-radius:12px;padding:14px 16px">🌋 Lava lamps</div>
        <div style="background:#1e293b;border-radius:12px;padding:14px 16px">🏔️ Parallax mountains</div>
        <div style="background:#1e293b;border-radius:12px;padding:14px 16px">🎙️ Live mic meter</div>
      </div>
    </section>
  </template>

  <template id="scr-profile">
    <section>
      <h2 style="margin:0 0 8px">👤 Profile</h2>
      <p style="color:#94a3b8;margin:0 0 16px">State is preserved per screen because each is its own subtree.</p>
      <div style="background:#1e293b;border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center">
        <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899)"></div>
        <div>
          <div style="font-weight:700;font-size:17px">Andre</div>
          <div style="color:#94a3b8;font-size:13px">Tina4 maintainer</div>
        </div>
      </div>
    </section>
  </template>

</body>
