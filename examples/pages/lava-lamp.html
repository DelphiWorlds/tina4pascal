<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molten — a CSS lava lamp</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    color: #f5edff;
    font-family: Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at 72% 47%, #251342 0%, #111027 42%, #090a18 78%);
  }
  .scene { width:100%; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .copy { width:100%; text-align:center; position:relative; z-index:2; }
  .eyebrow {
    color: #f1a8fa;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  h1 {
    margin: 18px 0 8px;
    font-size: 58px;
    line-height: .88;
    letter-spacing: -6px;
    font-weight: 800;
    color: #fff8ff;
  }
  .subtitle { margin: 12px auto 0; color: #b9afcf; font-size: 15px; line-height: 1.6; max-width: 430px; }
  .rule { width: 54px; height: 3px; border-radius: 3px; margin: 18px auto; background: linear-gradient(90deg,#ff6bcb,#ffb45e); }
  .tags { display: flex; flex-wrap: wrap; justify-content:center; gap: 9px; }
  .tag { border: 1px solid rgba(232,205,255,.2); border-radius: 30px; color: #ded1ee; padding: 8px 12px; font-size: 11px; letter-spacing: .6px; }
  .palette { display: flex; justify-content:center; gap: 9px; margin-top: 16px; }
  .chip { width: 14px; height: 14px; border-radius: 50%; }
  .chip-one { background: #ff6bcb; box-shadow: 0 0 18px rgba(255,107,203,.8); }
  .chip-two { background: #ffb45e; box-shadow: 0 0 18px rgba(255,180,94,.8); }
  .chip-three { background: #b36bff; box-shadow: 0 0 18px rgba(179,107,255,.8); }

  .display { width:100%; height:510px; display:flex; align-items:center; justify-content:center; position:relative; }
  .lamp { width:240px; height:480px; position:relative; }
  .cap { position:absolute; z-index:5; left:51px; width:138px; background:linear-gradient(90deg,#55466c,#d9c4ed 28%,#746287 54%,#302b47); }
  .cap-top { top:4px; height:38px; border-radius:12px 12px 5px 5px; }
  .cap-neck { top:33px; left:72px; width:96px; height:34px; border-radius:4px 4px 9px 9px; }
  .glass {
    position: absolute;
    top: 54px;
    left: 8px;
    width: 224px;
    height: 400px;
    overflow: hidden;
    border-radius: 46% 46% 34% 34% / 16% 16% 12% 12%;
    border: 2px solid rgba(234,213,255,.46);
    background: linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.025) 24%,rgba(255,255,255,.01) 72%,rgba(255,255,255,.15)),
                linear-gradient(180deg,rgba(45,28,68,.76),rgba(22,16,41,.48) 56%,rgba(39,24,54,.66));
    box-shadow: inset 12px 0 22px rgba(255,255,255,.06), inset -12px 0 22px rgba(0,0,0,.22), 0 0 30px rgba(188,91,255,.12);
  }
  .glass::before { content:""; position:absolute; z-index:4; left:27px; top:26px; width:14px; height:365px; border-radius:50%; background:rgba(255,255,255,.12); filter:blur(5px); }
  .glass::after { content:""; position:absolute; z-index:3; right:24px; top:32px; width:7px; height:326px; border-radius:50%; background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.035) 24%,rgba(255,255,255,.08) 78%,rgba(255,255,255,.16)); }
  .wax { position: absolute; z-index: 2; border-radius: 999px; }
  .wax-a { width:112px; height:133px; left:58px; top:250px; background:linear-gradient(145deg,#ffd0e9 0%,#ff68c8 35%,#e62eae 72%,#8a26cd 100%); box-shadow:0 0 27px rgba(255,81,203,.68); animation: rise-a 8.4s ease-in-out infinite alternate; }
  .wax-b { width:91px; height:108px; left:20px; top:132px; background:linear-gradient(145deg,#fff0bd 0%,#ffbc60 35%,#ff724f 72%,#d53d91 100%); box-shadow:0 0 25px rgba(255,144,87,.62); animation: rise-b 6.8s ease-in-out infinite alternate; }
  .wax-c { width:83px; height:104px; left:121px; top:72px; background:linear-gradient(145deg,#ead8ff 0%,#b477ff 35%,#754cff 72%,#4a35c2 100%); box-shadow:0 0 28px rgba(163,112,255,.65); animation: rise-c 9.2s ease-in-out infinite alternate; }
  .wax-d { width:55px; height:66px; left:106px; top:211px; background:linear-gradient(145deg,#fff1cc,#ff9c72 40%,#ed4fbb 100%); box-shadow:0 0 20px rgba(255,104,187,.7); animation: rise-d 5.7s ease-in-out infinite alternate; }
  .base { position:absolute; z-index:5; left:23px; bottom:8px; width:194px; height:66px; border-radius:12px 12px 35px 35px; background:linear-gradient(180deg,#9f83b7 0%,#4a3b60 22%,#28253b 68%,#151523 100%); box-shadow:inset 0 3px 2px rgba(255,255,255,.35),0 9px 13px rgba(0,0,0,.32); }
  .base::before { content:""; position:absolute; top:9px; left:32px; width:130px; height:3px; border-radius:4px; background:#ffd5fb; box-shadow:0 0 12px 4px rgba(255,125,221,.68); }
  .base::after { content:""; position:absolute; bottom:-7px; left:13px; width:168px; height:12px; border-radius:50%; background:#100f1c; }
  @keyframes rise-a { 0% { transform:translate(0,128px) scale(.82); } 48% { transform:translate(16px,-12px) scale(1.08); } 100% { transform:translate(-10px,-192px) scale(.9); } }
  @keyframes rise-b { 0% { transform:translate(0,172px) scale(.85); } 52% { transform:translate(21px,16px) scale(1.08); } 100% { transform:translate(-4px,-164px) scale(.9); } }
  @keyframes rise-c { 0% { transform:translate(0,190px) scale(.85); } 50% { transform:translate(-24px,14px) scale(1.1); } 100% { transform:translate(3px,-125px) scale(.9); } }
  @keyframes rise-d { 0% { transform:translate(-8px,142px) scale(.8); } 50% { transform:translate(18px,0) scale(1.12); } 100% { transform:translate(-10px,-176px) scale(.9); } }
</style>
</head>
<body>
  <main class="scene">
    <section class="copy">
      <div class="eyebrow">Tina4Pascal · CSS motion study</div>
      <h1>MOLTEN<span style="color:#ff78cc">.</span></h1>
      <div class="rule"></div>
      <p class="subtitle">A little pocket of slow-moving color. Built from HTML and CSS, animated by native keyframes.</p>
      <div class="tags"><span class="tag">PURE CSS</span><span class="tag">NO CANVAS</span><span class="tag">NO JAVASCRIPT</span></div>
      <div class="palette"><span class="chip chip-one"></span><span class="chip chip-two"></span><span class="chip chip-three"></span></div>
    </section>
    <section class="display" aria-label="Animated lava lamp">
      <div class="lamp">
        <div class="cap cap-top"></div><div class="cap cap-neck"></div>
        <div class="glass"><div class="wax wax-a"></div><div class="wax wax-b"></div><div class="wax wax-c"></div><div class="wax wax-d"></div></div>
        <div class="base"></div>
      </div>
    </section>
  </main>
</body>
</html>
