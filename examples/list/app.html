<body style="margin:0;background:#f8fafc;font-family:sans-serif;color:#0f172a">
  <div style="max-width:560px;margin:0 auto;padding:36px 24px">
    <h1 style="font-size:24px;margin:0 0 4px">Inventory</h1>
    <p style="color:#64748b;margin:0 0 20px">A live data table — add rows, delete any row (src/ListLogic.pas)</p>

    <div style="display:flex;gap:8px;margin-bottom:16px">
      <input id="newitem" placeholder="New item name…" style="flex:1;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px">
      <button onclick="list.add()" style="padding:11px 18px;border:0;border-radius:8px;background:#6366f1;color:#fff;font-weight:bold">Add</button>
      <button onclick="list.clear()" style="padding:11px 16px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#334155">Clear</button>
    </div>

    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden">
      <table style="width:100%;border-collapse:collapse;font-size:15px">
        <thead>
          <tr style="background:#f1f5f9;text-align:left">
            <th style="padding:10px 12px;width:48px">#</th>
            <th style="padding:10px 12px">Item</th>
            <th style="padding:10px 12px"></th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr id="row1" style="border-top:1px solid #e2e8f0"><td style="padding:10px 12px">1</td><td style="padding:10px 12px">Widget</td><td style="padding:8px 12px;text-align:right"><button onclick="list.del('row1')" style="padding:5px 10px;border:1px solid #fecaca;border-radius:6px;background:#fef2f2;color:#dc2626">Delete</button></td></tr>
          <tr id="row2" style="border-top:1px solid #e2e8f0"><td style="padding:10px 12px">2</td><td style="padding:10px 12px">Gadget</td><td style="padding:8px 12px;text-align:right"><button onclick="list.del('row2')" style="padding:5px 10px;border:1px solid #fecaca;border-radius:6px;background:#fef2f2;color:#dc2626">Delete</button></td></tr>
          <tr id="row3" style="border-top:1px solid #e2e8f0"><td style="padding:10px 12px">3</td><td style="padding:10px 12px">Sprocket</td><td style="padding:8px 12px;text-align:right"><button onclick="list.del('row3')" style="padding:5px 10px;border:1px solid #fecaca;border-radius:6px;background:#fef2f2;color:#dc2626">Delete</button></td></tr>
        </tbody>
      </table>
    </div>
    <p id="count" style="color:#64748b;font-size:14px;margin-top:12px">3 item(s)</p>
  </div>
</body>
