<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tina4 Location</title>
<style>
body{font-family:sans-serif;margin:0;padding:22px;color:#17202a}h1{margin:0 0 8px}
p{color:#566573;line-height:1.4}button{display:block;width:100%;margin:10px 0;padding:13px;border:0;border-radius:8px;background:#2874a6;color:#fff;font-size:16px}
button.secondary{background:#7f8c8d}#status{padding:12px;border-radius:8px;background:#f2f4f4;min-height:42px;white-space:pre-wrap}
</style></head><body>
<h1>Location demo</h1>
<p>Foreground permission and Core Location updates.</p>
<button onclick="location.request()">Request permission</button>
<button onclick="location.start()">Start updates</button>
<button class="secondary" onclick="location.stop()">Stop updates</button>
<div id="status">Ready.</div>
</body></html>
