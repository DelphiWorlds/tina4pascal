name: LocationSim
options:
  bundleIdPrefix: com.delphiworlds.location
  deploymentTarget:
    iOS: "15.0"
targets:
  LocationSim:
    type: application
    platform: iOS
    sources:
      - path: app
    dependencies:
      - framework: ../../../ios/sim/App/libtina4iossim.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: CoreFoundation.framework
      - sdk: ImageIO.framework
      - sdk: MobileCoreServices.framework
      - sdk: CoreLocation.framework
    info:
      path: app/Info.plist
      properties:
        CFBundleDisplayName: Location Simulator
        NSLocationWhenInUseUsageDescription: Use your location while the app is in the foreground.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.delphiworlds.location.sim
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: app/tina4iossim.h
        LIBRARY_SEARCH_PATHS:
          - ../../../ios/sim/App
        OTHER_LDFLAGS: "-Wl,-no_fixup_chains"
