<body style="margin:0;background:#0b1020;font-family:sans-serif;color:#e2e8f0">
  <div style="max-width:560px;margin:0 auto;padding:40px 24px">
    <h1 style="font-size:24px;margin:0 0 4px">Sales by week</h1>
    <p style="color:#64748b;margin:0 0 24px">A data-driven bar chart — bars built in src/ChartLogic.pas</p>

    <div style="background:#111735;border:1px solid #1e293b;border-radius:14px;padding:24px">
      <div id="chart" style="display:flex;align-items:flex-end;gap:12px;height:200px">
        <div style="width:40px;height:60px;background:#6366f1;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-size:12px;padding-top:4px">60</div>
        <div style="width:40px;height:110px;background:#6366f1;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-size:12px;padding-top:4px">110</div>
        <div style="width:40px;height:80px;background:#6366f1;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-size:12px;padding-top:4px">80</div>
        <div style="width:40px;height:150px;background:#6366f1;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-size:12px;padding-top:4px">150</div>
        <div style="width:40px;height:95px;background:#6366f1;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-size:12px;padding-top:4px">95</div>
        <div style="width:40px;height:130px;background:#6366f1;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-size:12px;padding-top:4px">130</div>
        <div style="width:40px;height:70px;background:#6366f1;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-size:12px;padding-top:4px">70</div>
        <div style="width:40px;height:175px;background:#6366f1;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-size:12px;padding-top:4px">175</div>
      </div>
    </div>

    <div style="margin-top:18px;display:flex;gap:10px">
      <button onclick="chart.randomize()" style="padding:11px 18px;border:0;border-radius:8px;background:#6366f1;color:#fff;font-weight:bold">Randomize</button>
      <button onclick="chart.reset()" style="padding:11px 18px;border:1px solid #334155;border-radius:8px;background:#1e293b;color:#e2e8f0">Reset</button>
    </div>
  </div>
</body>
