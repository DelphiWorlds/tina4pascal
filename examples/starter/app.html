<!doctype html>
<html data-theme="dark"><head>
  <!-- The default Tina4Pascal stylesheet. It ships in this project's assets/ and
       is bundled into the mobile app, so the same theme renders on every target.
       Remove the data-theme above to follow the system light/dark preference. -->
  <link rel="stylesheet" href="assets/tina4pascal.css">
</head>
<body>
  <section class="tina4-card" style="max-width:360px;margin:14vh auto;text-align:center">
    <div class="tina4-eyebrow">Tina4Pascal</div>
    <h1 class="tina4-display" id="count">{{ count }}</h1>
    <div style="color:var(--tina-muted);margin:4px 0 24px">taps so far</div>
    <div style="display:flex;gap:12px;justify-content:center">
      <button class="tina4-btn tina4-btn-secondary tina4-btn-lg" onclick="app.down()">–</button>
      <button class="tina4-btn tina4-btn-primary tina4-btn-lg" onclick="app.up()">+</button>
    </div>
  </section>
</body></html>
