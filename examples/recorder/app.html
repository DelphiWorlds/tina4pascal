<body style="margin:0;background:#0f172a;color:#e2e8f0;font-family:sans-serif">
  <div style="padding:48px 24px;text-align:center">
    <div style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#64748b">E3 · mic capture</div>
    <h1 style="margin:8px 0 6px">Recorder</h1>
    <p style="color:#94a3b8;margin:0 0 28px">Tap to record, tap again to stop — the saved filename lands on the button and the clip loads below.</p>
    <recorder style="font-size:20px;padding:16px 30px;border-radius:12px;background:#6366f1;color:#fff"></recorder>
    <div style="height:22px"></div>
    <div style="font-size:12px;letter-spacing:1px;color:#64748b;margin-bottom:6px">LIVE MIC LEVEL</div>
    <div style="height:18px;background:#1e293b;border-radius:9px;overflow:hidden">
      <div data-vu style="width:0;height:18px;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444)"></div>
    </div>
    <div style="height:26px"></div>
    <audio id="rec" controls style="width:100%"></audio>
  </div>
</body>
